<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Healthcare Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter','Noto Sans SC',sans-serif;
}
html{
    scroll-behavior:smooth;
}
body{
    background:#f7fbff;
    color:#0f172a;
    overflow-x:hidden;
    line-height:1.8;
}
body::before{
    content:"";
    position:fixed;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#60a5fa22,transparent 70%);
    top:-350px;
    right:-250px;
    z-index:-1;
}
body::after{
    content:"";
    position:fixed;
    width:800px;
    height:800px;
    background:radial-gradient(circle,#38bdf822,transparent 70%);
    bottom:-350px;
    left:-250px;
    z-index:-1;
}
body.detail-open{
    overflow:hidden;
}
body.detail-open nav,
body.detail-open main,
body.detail-open footer{
    filter:blur(9px);
    transform:scale(0.992);
    pointer-events:none;
    user-select:none;
}
nav,
main,
footer{
    transition:filter 0.28s ease,transform 0.28s ease;
}
/* navbar */
nav{
    width:100%;
    padding:22px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    z-index:1000;
    backdrop-filter:blur(16px);
    background:rgba(255,255,255,0.82);
    border-bottom:1px solid rgba(15,23,42,0.08);
}
nav h2{
    color:#2563eb;
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
}
nav ul{
    display:flex;
